<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'unsafe-inline';">
<style>
  :root {
    --accent: #6C5CE7;
    --accent-2: #00D9C0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: var(--vscode-font-family);
    background: var(--vscode-editor-background);
    color: var(--vscode-foreground);
  }
  #header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid var(--vscode-panel-border);
  }
  #pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  #title { font-size: 13px; font-weight: 600; letter-spacing: 0.3px; }
  #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg {
    opacity: 0; transform: translateY(8px);
    padding: 10px 13px; border-radius: 10px; max-width: 85%;
    font-size: 13px; line-height: 1.5;
  }
  .user {
    align-self: flex-end; background: var(--accent); color: #fff;
    border-bottom-right-radius: 3px;
  }
  .ai {
    align-self: flex-start; background: var(--vscode-input-background);
    border: 1px solid var(--vscode-panel-border);
    border-bottom-left-radius: 3px;
  }
  #inputArea {
    display: flex; gap: 8px; padding: 12px;
    border-top: 1px solid var(--vscode-panel-border);
  }
  #promptInput {
    flex: 1; background: var(--vscode-input-background);
    color: var(--vscode-input-foreground);
    border: 1px solid var(--vscode-input-border);
    border-radius: 8px; padding: 9px 12px; font-size: 13px; outline: none;
  }
  #promptInput:focus { border-color: var(--accent); }
  #sendBtn {
    background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 0 16px; cursor: pointer; font-size: 13px;
    transition: background 0.15s;
  }
  #sendBtn:hover { background: var(--accent-2); }
</style>
</head>
<body>
  <div id="header">
    <div id="pulse"></div>
    <div id="title">Cérebro IA</div>
  </div>
  <div id="messages"></div>
  <div id="inputArea">
    <input id="promptInput" placeholder="Pergunte algo..." />
    <button id="sendBtn">Enviar</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const vscode = acquireVsCodeApi();
    window.onerror = function(msg, url, line) { vscode.postMessage({ type: 'jserror', text: msg + ' at line ' + line }); };
    const messages = document.getElementById('messages');
    const input = document.getElementById('promptInput');
    const pulse = document.getElementById('pulse');

    function addMessage(text, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      gsap.to(div, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" });
    }

    function setThinking(on) {
      if (on) {
        gsap.to(pulse, { scale: 1.6, opacity: 0.5, duration: 0.6, repeat: -1, yoyo: true, ease: "sine.inOut" });
      } else {
        gsap.killTweensOf(pulse);
        gsap.to(pulse, { scale: 1, opacity: 1, duration: 0.3 });
      }
    }

    function send() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      setThinking(true);
      vscode.postMessage({ type: 'ask', text });
      input.value = '';
    }

    document.getElementById('sendBtn').onclick = send;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

    window.addEventListener('message', event => {
      const msg = event.data;
      if (msg.type === 'response') {
        setThinking(false);
        addMessage(msg.text, 'ai');
      }
    });
  </script>
</body>
</html>
